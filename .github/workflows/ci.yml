name: 'CI'

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel in-progress runs when new commits are pushed to the same PR.
# This is desired behavior - we don't want to waste resources on old commits.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  checks: write
  pull-requests: read
  contents: read

jobs:
  # Helper job that sleeps to simulate a slow check
  sleep-for-CI:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sleep 15

  # Fast check that completes quickly
  fast-check:
    runs-on: ubuntu-latest
    steps:
      - run: echo "done"

  # Slow check that takes a while
  slow-check:
    runs-on: ubuntu-latest
    steps:
      - run: sleep 20 && echo "done"

  # Build and test the action
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install
      - run: npm run all

  # E2E test: Create check runs on PR open (initial trigger)
  test-regex-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          check-run-name: 'Regex Mode Test'
          check-run-regex: "^sleep-for-CI$"

  # E2E test: Create check runs on PR open (initial trigger)
  test-required-checks-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          check-run-name: 'Required Checks Test'
          required-check-runs: |
            fast-check
            slow-check
          timeout-seconds: 120
