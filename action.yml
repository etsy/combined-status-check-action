name: 'Combined Status Check'
description: 'Combine many status checks into one required check using event-driven architecture.'
author: 'Etsy'
inputs:
  token:
    description: GitHub Actions access token. Requires checks:write permission.
    default: ${{ github.token }}

  check-run-name:
    description: >
      The name of the check run that this action creates and manages.
      This name should be unique and is what you'll add to branch protection.
    default: 'Combined Status Check'

  timeout-seconds:
    description: The maximum number of seconds to wait for all status checks to resolve.
    default: 300

  status-regex:
    description: >
      A regular expression used to filter statuses based on their `context` attribute. Statuses that do not match this
      expression are ignored. Cannot be used with required-check-runs.
    default: ^.*$

  check-run-regex:
    description: >
      A regular expression used to filter check runs based on their `name` attribute. Check runs that do not match this
      expression are ignored. Cannot be used with required-check-runs.
    default: ^.*$

  required-check-runs:
    description: >
      Newline-separated list of check run names that must all appear and succeed.
      Uses exact name matching. Cannot be used with a custom check-run-regex or status-regex.
    default: ''

  auto-pass-branch-prefix:
    description: >
      Branch name prefix that triggers automatic success without checking status checks.
      If the branch name starts with this prefix (case-sensitive), the action immediately
      passes. Leave empty to disable this feature.
    default: ''

  # Deprecated inputs (kept for v1 compatibility, ignored in v2)
  initial-delay-seconds:
    description: >
      DEPRECATED in v2: The number of seconds to wait before examining status checks.
      This input is ignored in the event-driven architecture.
    default: 10

  interval-seconds:
    description: >
      DEPRECATED in v2: The number of seconds to wait in between examining status checks.
      This input is ignored in the event-driven architecture.
    default: 2

runs:
  using: 'node20'
  main: 'dist/index.js'
